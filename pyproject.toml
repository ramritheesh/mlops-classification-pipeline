[project]
name = "mlops-classification-pipeline"
version = "0.1.0"
description = "End-to-End MLOps Pipeline with Experiment Tracking, Model Registry, Automated Deployment and Monitoring"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MLOps Candidate" }
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20"
]
